<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102544">
  <title>삼성 헌터스 오더</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="assets/hunters.png" alt="" class="logo"><span>삼성 헌터스</span></div>
    <button id="themeButton" class="icon-button" type="button" aria-label="테마 전환">◐</button>
  </header>

  <main class="shell">
    <aside class="sidebar" aria-label="주 메뉴">
      <button class="nav-button active" data-view="home" type="button">홈</button>
      <button class="nav-button" data-view="orders" type="button">오더</button>
      <button class="nav-button" data-view="players" type="button">선수</button>
    </aside>

    <div class="content">
      <p id="environmentNotice" class="environment-notice" hidden></p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="draftNotice" class="draft-notice card" hidden>
        <div><strong>작성 중인 오더가 있습니다</strong><p id="draftNoticeText" class="muted"></p></div>
        <div class="header-actions"><button id="resumeDraftButton" class="primary-button" type="button">이어쓰기</button><button id="discardDraftButton" class="secondary-button" type="button">초안 삭제</button></div>
      </div>

      <section id="homeView" class="view">
        <div class="hero card">
          <p class="eyebrow">SAMSUNG HUNTERS</p>
          <h1>경기 오더를<br>한눈에 확인하세요</h1>
          <p>그라운드에서 수비 위치를 보고, 필요한 선수를 바로 배치할 수 있습니다.</p>
          <button id="newOrderButton" class="primary-button" type="button">새 오더 작성</button>
        </div>
        <section class="card section-card">
          <div class="section-heading"><h2>최근 오더</h2><button class="text-button" data-view="orders" type="button">전체 보기</button></div>
          <div id="recentOrders" class="order-list"></div>
        </section>
      </section>

      <section id="ordersView" class="view" hidden>
        <div class="page-heading"><div><p class="eyebrow">ORDERS</p><h1>오더</h1></div><button id="newOrderButton2" class="primary-button" type="button">새 오더</button></div>
        <div id="allOrders" class="order-list card"></div>
      </section>

      <section id="playersView" class="view" hidden>
        <div class="page-heading"><div><p class="eyebrow">ROSTER</p><h1>선수</h1></div></div>
        <div class="player-admin-toolbar"><input id="playerSearch" class="search-input" type="search" placeholder="이름 또는 등번호 검색" aria-label="선수 검색"><div class="player-admin-actions"><button id="changePasswordButton" class="secondary-button" type="button">비밀번호 변경</button><button id="newPlayerButton" class="primary-button" type="button">선수 추가</button></div></div>
        <div class="roster-save-bar"><p id="rosterChanges" role="status"></p><div class="roster-save-actions"><button id="resetRosterButton" class="secondary-button" type="button">원래대로</button><button id="saveRosterButton" class="primary-button" type="button" disabled>전체 저장</button></div></div>
        <form id="playerForm" class="card player-form player-add-form" aria-label="선수 추가" hidden>
          <div class="player-add-row">
            <label>이름<input id="editPlayerName" type="text" placeholder="새 선수" maxlength="40" required></label>
            <label>배번<input id="editPlayerNumber" type="text" maxlength="20"></label>
            <div id="playerHandFields" class="player-hand-fields"></div>
            <div id="playerAbilityFields" class="player-ability-fields"></div>
            <button id="savePlayerButton" class="primary-button" type="submit">추가</button>
            <button id="cancelPlayerButton" class="text-button" type="button">취소</button>
          </div>
        </form>
        <div id="playerList" class="player-admin-table-wrap card"></div>
      </section>

      <section id="detailView" class="view" hidden>
        <div class="page-heading"><div><p class="eyebrow">ORDER DETAIL</p><h1 id="detailTitle">오더</h1><p id="detailDate" class="muted"></p></div><div class="header-actions"><button id="shareButton" class="secondary-button" type="button">링크 공유</button><button id="captureButton" class="secondary-button" type="button">이미지 저장</button><button id="editButton" class="primary-button" type="button">수정</button></div></div>
        <div id="detailField" class="field" aria-label="수비 포지션"></div>
        <div class="detail-columns">
          <section class="card section-card"><h2>선발 명단</h2><ol id="detailLineup" class="lineup-list"></ol></section>
          <section class="card section-card"><h2>대기 명단</h2><div id="detailWaiting" class="waiting-list"></div></section>
        </div>
      </section>

      <section id="editorView" class="view" hidden>
        <div class="page-heading"><div><p class="eyebrow">ORDER EDITOR</p><h1>오더 작성</h1></div><div class="header-actions"><button id="captureDraftButton" class="secondary-button" type="button">이미지 저장</button><button id="saveButton" class="primary-button" type="button">저장</button></div></div>
        <label class="field-label" for="orderName">오더명</label>
        <input id="orderName" class="text-input" type="text" placeholder="예: 26-09-19 NBL" autocomplete="off">
        <p class="hint">그라운드의 포지션을 눌러 선수를 배치하세요.</p>
        <div id="editorField" class="field interactive-field" aria-label="수비 포지션 선택"></div>
        <div class="detail-columns">
          <section class="card section-card"><h2>타순</h2><div id="editorLineup" class="editor-lineup"></div></section>
          <section class="card section-card"><h2>참가 · 대기 선수</h2><div class="add-row"><select id="addPlayerSelect" aria-label="참가 선수 추가"></select><button id="addPlayerButton" class="secondary-button" type="button">추가</button></div><div id="editorPlayers" class="editor-players"></div></section>
        </div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="주 메뉴">
    <button class="nav-button active" data-view="home" type="button"><span>⌂</span>홈</button>
    <button class="nav-button" data-view="orders" type="button"><span>⚾</span>오더</button>
    <button class="nav-button" data-view="players" type="button"><span>♧</span>선수</button>
  </nav>

  <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
  <section id="playerSheet" class="player-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle"></div>
    <div class="section-heading"><h2 id="sheetTitle">선수 선택</h2><button id="closeSheet" class="icon-button" type="button" aria-label="닫기">×</button></div>
    <input id="sheetSearch" class="search-input" type="search" placeholder="선수 검색" aria-label="선수 검색">
    <div id="sheetPlayers" class="sheet-players"></div>
  </section>
  <script>
    if (location.protocol === 'file:') {
      const notice = document.getElementById('environmentNotice');
      notice.hidden = false;
      notice.textContent = '파일로 직접 열면 버튼이 작동하지 않습니다. 이 폴더에서 node dev-server.js를 실행한 뒤 http://127.0.0.1:8765 로 접속하세요.';
    }
    window.addEventListener('error', event => {
      if (location.protocol === 'file:') return;
      const status = document.getElementById('status');
      status.classList.add('error');
      status.textContent = '화면 스크립트를 실행하지 못했습니다. 개발자 콘솔에서 오류를 확인하세요.';
    });
  </script>
</body>
</html>
