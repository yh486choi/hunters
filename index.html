<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102544">
  <title>삼성 헌터스 오더</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="assets/hunters.png" alt="" class="logo"><span>삼성 헌터스</span></div>
    <button id="themeButton" class="icon-button" type="button" aria-label="테마 전환">◐</button>
  </header>

  <main class="shell">
    <aside class="sidebar" aria-label="주 메뉴">
      <button class="nav-button active" data-view="orders" type="button">오더</button>
      <button class="nav-button" data-view="players" type="button">선수</button>
    </aside>

    <div class="content">
      <p id="environmentNotice" class="environment-notice" hidden></p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="draftNotice" class="draft-notice card" hidden>
        <div><strong>작성 중인 오더가 있습니다</strong><p id="draftNoticeText" class="muted"></p></div>
        <div class="header-actions"><button id="resumeDraftButton" class="primary-button" type="button">이어쓰기</button><button id="discardDraftButton" class="secondary-button" type="button">초안 삭제</button></div>
      </div>

      <section id="ordersView" class="view">
        <div class="page-heading"><div><p class="eyebrow">ORDERS</p><h1>오더</h1></div><button id="newOrderButton" class="primary-button" type="button">새 오더</button></div>
        <div class="orders-workspace">
          <section class="order-preview card">
            <div class="header-actions"><button id="editButton" class="primary-button" type="button" disabled>수정</button><button id="captureButton" class="secondary-button" type="button" disabled>캡처</button><button id="copyLinkButton" class="secondary-button" type="button" disabled>링크</button><button id="shareButton" class="secondary-button" type="button" disabled>공유</button></div>
            <h2 id="detailTitle">오더를 선택하세요</h2><p id="detailDate" class="muted"></p>
            <div id="detailField" class="field" aria-label="수비 포지션"></div>
            <div class="order-tables">
              <table class="classic-table lineup-table"><caption>선발 명단</caption><thead><tr><th>타순</th><th>선수명</th><th>포지션</th></tr></thead><tbody id="detailLineup"></tbody></table>
              <table class="classic-table waiting-table"><caption>대기 명단</caption><thead><tr><th>선수명</th></tr></thead><tbody id="detailWaiting"></tbody></table>
            </div>
          </section>
          <section class="order-list-panel card" aria-label="오더 목록">
            <table class="classic-table order-list-table"><thead><tr><th>오더명</th><th>저장일자</th><th>관리</th></tr></thead><tbody id="allOrders"></tbody></table>
            <nav id="orderPagination" class="order-pagination" aria-label="오더 목록 페이지"></nav>
          </section>
        </div>
      </section>

      <section id="playersView" class="view" hidden>
        <div class="page-heading"><div><p class="eyebrow">ROSTER</p><h1>선수</h1></div></div>
        <div class="player-admin-toolbar"><input id="playerSearch" class="search-input" type="search" placeholder="이름 또는 등번호 검색" aria-label="선수 검색"><div class="player-admin-actions"><button id="changePasswordButton" class="secondary-button" type="button">비밀번호 변경</button><button id="newPlayerButton" class="primary-button" type="button">선수 추가</button></div></div>
        <div class="roster-save-bar"><p id="rosterChanges" role="status"></p><div class="roster-save-actions"><button id="resetRosterButton" class="secondary-button" type="button">원래대로</button><button id="saveRosterButton" class="primary-button" type="button" disabled>전체 저장</button></div></div>
        <form id="playerForm" class="card player-form player-add-form" aria-label="선수 추가" hidden>
          <div class="player-add-row">
            <label>이름<input id="editPlayerName" type="text" placeholder="새 선수" maxlength="40" required></label>
            <label>배번<input id="editPlayerNumber" type="text" maxlength="20"></label>
            <div id="playerHandFields" class="player-hand-fields"></div>
            <div id="playerAbilityFields" class="player-ability-fields"></div>
            <button id="savePlayerButton" class="primary-button" type="submit">추가</button>
            <button id="cancelPlayerButton" class="text-button" type="button">취소</button>
          </div>
        </form>
        <div id="playerList" class="player-admin-table-wrap card"></div>
      </section>

      <section id="editorView" class="view" hidden>
        <div class="page-heading"><h1>오더 작성</h1><button class="secondary-button" type="button" data-view="orders">오더 목록</button></div>
        <div class="order-edit-toolbar"><label for="orderName">오더명</label><input id="orderName" class="text-input" type="text" placeholder="예: 26-09-19 NBL" autocomplete="off"><button id="saveButton" class="primary-button" type="button">저장</button><button id="captureDraftButton" class="secondary-button" type="button">캡처</button></div>
        <div class="editor-workspace">
          <section class="participant-panel card"><h2>참가 명단 <small id="participantCount">0</small></h2><div class="add-row"><select id="addPlayerSelect" aria-label="참가 선수 추가"></select><button id="addPlayerButton" class="secondary-button" type="button">추가</button></div><table class="classic-table"><thead><tr><th>No</th><th>선수명</th><th>관리</th></tr></thead><tbody id="editorPlayers"></tbody></table></section>
          <section class="order-preview card">
            <div id="editorField" class="field interactive-field" aria-label="수비 포지션 선택"></div>
            <div class="order-tables">
              <table class="classic-table lineup-table"><caption>선발 명단</caption><thead><tr><th>타순</th><th>선수명</th><th>포지션</th></tr></thead><tbody id="editorLineup"></tbody></table>
              <table class="classic-table waiting-table"><caption>대기 명단</caption><thead><tr><th>선수명</th></tr></thead><tbody id="editorWaiting"></tbody></table>
            </div>
            <p class="hint">대기 선수를 누르면 제외·복귀를 전환합니다.</p>
          </section>
          <section class="ability-panel card"><h2>포지션별 선수</h2><p class="hint">이름을 눌러 배치·해제합니다.</p><table class="classic-table"><thead><tr><th>포지션</th><th>구분</th><th>참가 선수</th></tr></thead><tbody id="editorAbilities"></tbody></table></section>
        </div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="주 메뉴">
    <button class="nav-button active" data-view="orders" type="button"><span>⚾</span>오더</button>
    <button class="nav-button" data-view="players" type="button"><span>♧</span>선수</button>
  </nav>

  <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
  <section id="playerSheet" class="player-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle"></div>
    <div class="section-heading"><h2 id="sheetTitle">선수 선택</h2><button id="closeSheet" class="icon-button" type="button" aria-label="닫기">×</button></div>
    <input id="sheetSearch" class="search-input" type="search" placeholder="선수 검색" aria-label="선수 검색">
    <div id="sheetPlayers" class="sheet-players"></div>
  </section>
  <script>
    if (location.protocol === 'file:') {
      const notice = document.getElementById('environmentNotice');
      notice.hidden = false;
      notice.textContent = '파일로 직접 열면 버튼이 작동하지 않습니다. 이 폴더에서 node dev-server.js를 실행한 뒤 http://127.0.0.1:8765 로 접속하세요.';
    }
    window.addEventListener('error', event => {
      if (location.protocol === 'file:') return;
      const status = document.getElementById('status');
      status.classList.add('error');
      status.textContent = '화면 스크립트를 실행하지 못했습니다. 개발자 콘솔에서 오류를 확인하세요.';
    });
  </script>
</body>
</html>
