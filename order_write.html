<!DOCTYPE html>
<html lang='ko'>

<head>
  <meta charset='UTF-8' />
  <title>⚾ 삼성 헌터스 오더 작성 ⚾</title>

  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="order_write.css" />
  <script>
    /* 페이지 깜빡임 방지: HTML을 읽자마자 테마 적용 */
    (function () {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark-mode');
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body>
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText">데이터 처리 중...</div>
  </div>

  <h1>⚾ 삼성 헌터스 오더 작성 ⚾</h1>

  <hr>

  <div style='margin-top:10px; display:flex; gap:10px;'>
    <button class='buttonStyles' onclick="location.href='index.html'">🏠 홈화면</button>
    <button class='buttonStyles' onclick="toggleDarkMode()">🌓 테마 전환</button>
  </div>

  <div style='margin-top:10px;'>
    <label>오더명: </label>
    <input type='text' id='orderName' placeholder='ex) 26-03-01 NBL' style='width:260px; padding:6px;' />
    <button class='buttonStyles' onclick='saveOrder()'>💾 저장</button>
    <button class='buttonStyles' onclick='captureOrder()'>📷 캡처</button>
  </div>

  <div id='mainArea'>

    <div id='areaA' class='panelBox'>
      <span style="font-weight: bolder;">참가 명단</span>

      <div style='display:flex; gap:10px; align-items:center; margin-bottom:5px; margin-top: 5px;'>
        <select id='playerSelect' style="width: 100px;"></select>
        <button class='buttonStyles' onclick='addPlayer()'>추가</button>
      </div>

      <table class="table_common">
        <thead>
          <tr>
            <th style="width: 30px;">No</th>
            <th style="width: 80px;">선수명</th>
            <th style="width: 40px;"></th>
          </tr>
        </thead>
        <tbody id='playerTableBody'></tbody>
      </table>
    </div>

    <div id="orderViewPanel">
      <div id='positionWrapper'>
        <div id='areaB1'>
          <select id='pos_CF' class='posSelect' onchange='updatePosition("CF", this.value)'></select>
          <select id='pos_LF' class='posSelect' onchange='updatePosition("LF", this.value)'></select>
          <select id='pos_RF' class='posSelect' onchange='updatePosition("RF", this.value)'></select>

          <select id='pos_SS' class='posSelect' onchange='updatePosition("SS", this.value)'></select>
          <select id='pos_2B' class='posSelect' onchange='updatePosition("2B", this.value)'></select>
          <select id='pos_3B' class='posSelect' onchange='updatePosition("3B", this.value)'></select>
          <select id='pos_1B' class='posSelect' onchange='updatePosition("1B", this.value)'></select>

          <select id='pos_P' class='posSelect' onchange='updatePosition("P", this.value)'></select>
          <select id='pos_C' class='posSelect' onchange='updatePosition("C", this.value)'></select>
          <select id='pos_DH' class='posSelect' onchange='updatePosition("DH", this.value)'></select>
        </div>
      </div>

      <div id='middleWrapper'>
        <div id='areaC1'>
          <table class="table_common">
            <caption style='font-weight:bolder;'>선발 명단</caption>
            <thead>
              <tr>
                <th style="width: 25px;">타순</th>
                <th style="width: 90px;">선수명</th>
                <th style="width: 100px;">포지션</th>
              </tr>
            </thead>
            <tbody id='startingTableBody'></tbody>
          </table>
        </div>


        <div id='areaC2'>
          <table class="table_common">
            <caption style='font-weight:bolder;'>대기 명단</caption>
            <thead>
              <tr>
                <th style="width: 80px;">선수명</th>
              </tr>
            </thead>
            <tbody id='waitingTableBody'>
              <tr>
                <td></td>
              </tr>
              <tr>
                <td></td>
              </tr>
              <tr>
                <td></td>
              </tr>
              <tr>
                <td></td>
              </tr>
              <tr>
                <td></td>
              </tr>
              <tr>
                <td></td>
              </tr>
              <tr>
                <td></td>
              </tr>
              <tr>
                <td></td>
              </tr>
              <tr>
                <td></td>
              </tr>
              <tr>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id='areaB2'>
      <div id='positionAbilityContainer'></div>
    </div>

  </div>

  <script>
    // order_write.html 내의 <script> 안에 추가
    async function captureOrder() {
      const orderNameInput = document.getElementById('orderName').value.trim();

      // 1. 현재 시간 포맷팅 (YYMMDDHHMMSS)
      const now = new Date();
      const yy = String(now.getFullYear()).slice(2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      const timeString = `_${yy}${mm}${dd}${hh}${min}${ss}`;

      // 2. 파일명 조합 (예: order_260303_260303230800.jpg)
      const baseName = orderNameInput ? `order_${orderNameInput}` : 'order_capture';
      const filename = `${baseName}${timeString}.jpg`;

      showLoading("이미지 생성 중...");

      const originalTarget = document.getElementById("orderViewPanel");
      const clone = originalTarget.cloneNode(true);

      clone.style.position = 'absolute';
      clone.style.top = '-9999px';
      clone.style.left = '-9999px';
      // 배경색이 투명하게 나오지 않도록 body의 배경색을 가져와 깔아줍니다
      clone.style.backgroundColor = getComputedStyle(document.body).backgroundColor;
      document.body.appendChild(clone);

      try {
        const originalSelects = originalTarget.querySelectorAll('select');
        const cloneSelects = clone.querySelectorAll('select');

        for (let i = 0; i < originalSelects.length; i++) {
          const origSel = originalSelects[i];
          const clonedSel = cloneSelects[i];

          let selectedText = "";
          if (origSel.selectedIndex >= 0) {
            selectedText = origSel.options[origSel.selectedIndex].text;
          }
          if (selectedText.trim() === '') selectedText = '';

          // span 대신 div를 사용해야 박스 형태의 위치(absolute)와 크기를 잡기 수월합니다
          const textDiv = document.createElement('div');
          textDiv.textContent = selectedText;

          // ⭐ 핵심: CSS 위치 속성을 유지하기 위해 원본의 id와 class를 그대로 복사!
          textDiv.id = origSel.id;
          textDiv.className = origSel.className;

          // 기존 select 박스의 크기와 텍스트 중앙 정렬 스타일 복사
          textDiv.style.display = 'flex';
          textDiv.style.alignItems = 'center';
          textDiv.style.justifyContent = 'center';

          // 치환
          clonedSel.parentNode.replaceChild(textDiv, clonedSel);
        }

        const canvas = await html2canvas(clone, { scale: 2, useCORS: true });
        const link = document.createElement("a");
        link.href = canvas.toDataURL("image/jpeg", 0.92);
        link.download = filename;
        link.click();

      } catch (err) {
        alert("이미지 캡처 오류: " + err.message);
      } finally {
        document.body.removeChild(clone);
        hideLoading();
      }
    }


    function showLoading(text = "처리 중...") {
      document.getElementById("loadingText").textContent = text;
      document.getElementById("loadingOverlay").style.display = "flex";
    }
    function hideLoading() {
      document.getElementById("loadingOverlay").style.display = "none";
    }

    const API = { getPlayers: "https://us-central1-hunters-2026.cloudfunctions.net/getPlayers" };

    let playerDB = [];
    let selectedPlayers = [];
    let positionAssignments = {
      CF: '', LF: '', RF: '', SS: '', '2B': '', '3B': '', P: '', C: '', DH: '', '1B': ''
    };

    let startingList = [
      { name: '', num: '', pos: '' }, { name: '', num: '', pos: '' },
      { name: '', num: '', pos: '' }, { name: '', num: '', pos: '' },
      { name: '', num: '', pos: '' }, { name: '', num: '', pos: '' },
      { name: '', num: '', pos: '' }, { name: '', num: '', pos: '' },
      { name: '', num: '', pos: '' }, { name: '', num: '', pos: '' }
    ];

    // 새로 추가된 상태: 대기 명단에서 취소선 처리된 선수 목록
    let excludedPlayers = [];

    const abilityPositions = [
      { key: 'p', label: '투수' }, { key: 'c', label: '포수' },
      { key: '1b', label: '1루' }, { key: '2b', label: '2루' },
      { key: '3b', label: '3루' }, { key: 'ss', label: '유격' },
      { key: 'of', label: '외야' }
    ];

    /* 테마 관련 로직 */
    function applySavedTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
      } else {
        document.body.classList.remove('dark-mode');
      }
    }

    function toggleDarkMode() {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    async function loadPlayerDB() {
      showLoading("선수 명단을 동기화하고 있습니다...");
      try {
        const res = await fetch(API.getPlayers);
        playerDB = await res.json();
      } finally {
        hideLoading();
      }
    }

    function nameWithNum(name) {
      if (!name) return '';
      const p = playerDB.find(x => x.name === name);
      return p ? `${name}(${p.num})` : name;
    }

    function renderPlayerSelect() {
      const select = document.getElementById('playerSelect');
      select.innerHTML = '';
      const candidates = playerDB.filter(p => !selectedPlayers.includes(p.name));
      if (candidates.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = '추가 없음';
        opt.disabled = true;
        select.appendChild(opt);
        return;
      }
      candidates.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.name;
        opt.textContent = `${p.name}(${p.num})`;
        select.appendChild(opt);
      });
    }

    function renderPlayerTable() {
      const tbody = document.getElementById('playerTableBody');
      tbody.innerHTML = '';

      // 정렬된 배열 뒤에 index(idx) 매개변수를 추가합니다.
      selectedPlayers.slice().sort((a, b) => a.localeCompare(b, 'ko')).forEach((name, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${idx + 1}</td> <td>${nameWithNum(name)}</td>
          <td><button class='buttonStyles' onclick='removePlayer("${name}")'>삭제</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addPlayer() {
      const selectElement = document.getElementById('playerSelect');
      const name = selectElement.value;
      if (name && !selectedPlayers.includes(name)) {
        selectedPlayers.push(name);
        refreshAll();
        // 추가 후 select box 초기화
        if (selectElement.options.length > 0) {
          selectElement.selectedIndex = 0;
        }
      }
    }

    function removePlayer(name) {
      selectedPlayers = selectedPlayers.filter(n => n !== name);
      // 포지션 제거
      for (const key in positionAssignments) { if (positionAssignments[key] === name) positionAssignments[key] = ''; }
      // 선발명단 제거
      startingList = startingList.map(r => r.name === name ? { name: '', num: '', pos: '' } : r);
      // 취소선 명단에서도 제거
      excludedPlayers = excludedPlayers.filter(n => n !== name);
      refreshAll();
    }

    function renderPositionSelects() {
      const selects = document.querySelectorAll('.posSelect');
      selects.forEach(sel => {
        const pos = sel.id.replace('pos_', '');
        sel.innerHTML = '';
        const blank = document.createElement('option');
        blank.value = ''; blank.textContent = ' ';
        sel.appendChild(blank);
        selectedPlayers.forEach(name => {
          const p = playerDB.find(x => x.name === name);
          const opt = document.createElement('option');
          opt.value = name; opt.textContent = `${name}(${p.num})`;
          const assignedPos = Object.keys(positionAssignments).find(k => positionAssignments[k] === name);
          if (assignedPos && assignedPos !== pos) { opt.style.background = '#d0d0d0'; opt.style.color = '#555'; }
          if (positionAssignments[pos] === name) opt.selected = true;
          sel.appendChild(opt);
        });
      });
    }

    function updatePositionBySelect(idx, pos) {
      const nameA = startingList[idx].name;
      if (!nameA) return;

      // 1. 선택한 포지션(pos)을 이미 차지하고 있는 다른 선수 B가 있는지 확인
      const nameB = positionAssignments[pos];

      // 2. 선수 A가 원래 가지고 있던 포지션(oldPosOfA) 찾기
      const oldPosOfA = Object.keys(positionAssignments).find(k => positionAssignments[k] === nameA);

      if (nameB && nameB !== nameA) {
        if (oldPosOfA) {
          // 선수 A의 이전 흔적을 지워 간섭 차단
          positionAssignments[oldPosOfA] = '';

          // 3. 선수 B를 A의 이전 위치로 이동 (완전 스왑)
          positionAssignments[oldPosOfA] = nameB;

          // 선발 명단 데이터(startingList)에서도 B의 포지션 텍스트 동기화
          const idxOfB = startingList.findIndex(r => r.name === nameB);
          if (idxOfB !== -1) {
            startingList[idxOfB].pos = convertPosition(oldPosOfA);
          }
        } else {
          // A가 원래 포지션이 없었다면 B는 할당 해제
          for (const key in positionAssignments) {
            if (positionAssignments[key] === nameB && key !== pos) {
              positionAssignments[key] = '';
            }
          }
          const idxOfB = startingList.findIndex(r => r.name === nameB);
          if (idxOfB !== -1) {
            startingList[idxOfB].pos = '';
          }
        }
      }

      // [추가 로직] 투수(P)로 변경되는 경우, 투수 행(10번째) 데이터도 동기화
      if (pos === 'P') {
        startingList[9] = {
          name: nameA,
          num: playerDB.find(x => x.name === nameA)?.num || '',
          pos: '투수(P)'
        };
      }

      // 4. A에게 새 포지션 할당
      updatePosition(pos, nameA);
    }

    function setupStartingTable() {
      const tbody = document.getElementById('startingTableBody');
      tbody.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const label = i === 9 ? '투수' : (i + 1);
        const tr = document.createElement('tr');

        if (i === 9) {
          // 투수는 선수명만 드롭다운, 포지션은 텍스트(span)로 고정
          tr.innerHTML = `
        <td>${label}</td>
        <td><select id='start_sel_${i}' style='width:90px' onchange='selectStarting(${i}, this.value)'></select></td>
        <td id='start_pos_txt_9' style='font-size: 12px; text-align: center;'></td>
      `;
        } else {
          // 1~9번 타자는 선수와 포지션 모두 드롭다운
          tr.innerHTML = `
        <td>${label}</td>
        <td><select id='start_sel_${i}' style='width:90px' onchange='selectStarting(${i}, this.value)'></select></td>
        <td><select id='start_pos_sel_${i}' style='width:105px; font-size:12px;' onchange='updatePositionBySelect(${i}, this.value)'></select></td>
      `;
        }
        tbody.appendChild(tr);
      }
    }

    function updatePosition(pos, name) {
      if (!name) {
        const oldPlayer = positionAssignments[pos];
        if (oldPlayer) {
          const idx = startingList.findIndex(r => r.name === oldPlayer);
          if (idx !== -1) startingList[idx].pos = '';
        }
        positionAssignments[pos] = '';
        refreshAll();
        return;
      }

      const oldPlayerB = positionAssignments[pos]; // 기존 점유자 B (ex: 기존 투수)
      const oldPosOfA = Object.keys(positionAssignments).find(k => positionAssignments[k] === name && k !== pos); // 이동할 선수 A의 이전 위치

      if (oldPlayerB && oldPlayerB !== name) {
        const startIdxOfB = startingList.findIndex(r => r.name === oldPlayerB);
        const startIdxOfA = startingList.findIndex(r => r.name === name);

        // [1] 선수 A가 이미 타순에 있는 경우: 타순 위치 고정
        if (startIdxOfA !== -1) {
          startingList[startIdxOfA].pos = convertPosition(pos);

          // [2] 상대방 B가 타순에 있는 경우만 스왑 발생
          if (startIdxOfB !== -1) {
            startingList[startIdxOfB].pos = oldPosOfA ? convertPosition(oldPosOfA) : '';
            if (oldPosOfA) {
              positionAssignments[oldPosOfA] = oldPlayerB;
            }
          } else {
            // [핵심 수정] B가 타순에 없다면 모든 포지션 할당을 초기화 (대기 명단으로)
            for (const key in positionAssignments) {
              if (positionAssignments[key] === oldPlayerB) {
                positionAssignments[key] = '';
              }
            }
            // A의 이전 자리도 비워줌 (B가 가지 않으므로)
            if (oldPosOfA) positionAssignments[oldPosOfA] = '';
          }
        }
        else if (startIdxOfB !== -1) {
          // [3] 선수 A가 대기 명단에서 온 경우: 기존 선수 B의 타순을 승계
          const pA = playerDB.find(x => x.name === name);
          startingList[startIdxOfB] = {
            name: name,
            num: pA ? pA.num : '',
            pos: convertPosition(pos)
          };
          if (oldPosOfA) positionAssignments[oldPosOfA] = '';
        } else {
          // [4] 둘 다 타순에 없는 경우: B의 흔적 삭제
          for (const key in positionAssignments) {
            if (positionAssignments[key] === oldPlayerB) positionAssignments[key] = '';
          }
        }

        // [투수 전용 데이터 동기화 보정]
        if (pos === 'P') {
          const pA = playerDB.find(x => x.name === name);
          startingList[9] = { name: name, num: pA ? pA.num : '', pos: '투수(P)' };
        }
        else if (oldPosOfA === 'P') {
          // A가 투수였고 다른 곳으로 갈 때, 타순에 없는 B가 투수 자리에 남지 않도록 초기화
          if (startIdxOfB === -1) startingList[9] = { name: '', num: '', pos: '' };
        }
      } else {
        // 일반적인 이동 처리
        if (oldPosOfA) positionAssignments[oldPosOfA] = '';
        const startIdxOfA = startingList.findIndex(r => r.name === name);
        if (startIdxOfA !== -1) startingList[startIdxOfA].pos = convertPosition(pos);

        if (pos === 'P') {
          const pA = playerDB.find(x => x.name === name);
          startingList[9] = { name: name, num: pA ? pA.num : '', pos: '투수(P)' };
        }
      }

      // 최종 위치 확정
      positionAssignments[pos] = name;
      excludedPlayers = excludedPlayers.filter(n => n !== name);
      refreshAll();
    }

    // 4. 선발 명단 렌더링 (생략 없는 전체 버전)
    function renderStartingTable() {
      const assignedPlayers = Object.values(positionAssignments).filter(Boolean);
      const posOptions = [
        { v: 'P', t: '투수(P)' }, { v: 'C', t: '포수(C)' }, { v: '1B', t: '1루수(1B)' },
        { v: '2B', t: '2루수(2B)' }, { v: '3B', t: '3루수(3B)' }, { v: 'SS', t: '유격수(SS)' },
        { v: 'LF', t: '좌익수(LF)' }, { v: 'CF', t: '중견수(CF)' }, { v: 'RF', t: '우익수(RF)' }, { v: 'DH', t: '지명타자(DH)' }
      ];

      const assignedSorted = assignedPlayers.slice().sort((a, b) => a.localeCompare(b, 'ko'));
      const unassignedSorted = selectedPlayers
        .filter(name => !assignedPlayers.includes(name))
        .sort((a, b) => a.localeCompare(b, 'ko'));
      const sortedDropdownPlayers = [...assignedSorted, ...unassignedSorted];

      for (let i = 0; i < 10; i++) {
        const pSel = document.getElementById(`start_sel_${i}`);
        if (!pSel) continue;

        // [1] 선수 드롭다운 업데이트
        pSel.innerHTML = '<option value=""></option>';
        let currentName = (startingList[i] && startingList[i].name) ? startingList[i].name : '';

        // 투수 행 전용: 이름이 없으면 P 포지션에 할당된 선수를 기본값으로 시도
        if (i === 9 && !currentName) {
          currentName = positionAssignments['P'] || '';
        }

        sortedDropdownPlayers.forEach(name => {
          const p = playerDB.find(x => x.name === name);
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = `${name}(${p ? p.num : ''})`;
          if (currentName === name) opt.selected = true;
          pSel.appendChild(opt);
        });

        // [2] 포지션 처리 (타순은 드롭다운, 투수는 텍스트)
        const currentPosCode = Object.keys(positionAssignments).find(k => positionAssignments[k] === currentName);

        if (i === 9) {
          // 투수 행: 텍스트로 표기
          const posTxt = document.getElementById('start_pos_txt_9');
          posTxt.textContent = currentName ? '투수(P)' : '';
        } else {
          // 1~9번 타자: 드롭다운 업데이트 및 초기 공백 보장
          const posSel = document.getElementById(`start_pos_sel_${i}`);
          if (posSel) {
            posSel.innerHTML = '<option value=""></option>';
            posOptions.forEach(opt => {
              const o = document.createElement('option');
              o.value = opt.v; o.textContent = opt.t;
              if (currentName && currentPosCode === opt.v) o.selected = true;
              posSel.appendChild(o);
            });
            if (!currentPosCode) posSel.selectedIndex = 0;
          }
        }

        // [3] 데이터 동기화
        if (currentName) {
          const p = playerDB.find(x => x.name === currentName);
          const finalPosCode = (i === 9) ? 'P' : (currentPosCode || '');
          startingList[i] = {
            name: currentName,
            num: p ? p.num : '',
            pos: finalPosCode ? convertPosition(finalPosCode) : ""
          };
          if (i === 9 && positionAssignments['P'] !== currentName) {
            positionAssignments['P'] = currentName;
          }
        } else {
          startingList[i] = { name: '', num: '', pos: '' };
        }
      }
    }

    function selectStarting(idx, name) {
      // 1. 기존 타순 선수 A의 정보 최상단에서 완벽히 백업
      const playerA_Name = (idx === 9) ? (positionAssignments['P'] || '') : (startingList[idx].name || '');
      const pA = playerDB.find(x => x.name === playerA_Name);
      const oldPosOfA = Object.keys(positionAssignments).find(k => positionAssignments[k] === playerA_Name) || '';

      const nameB = name; // 새로 선택된 선수 B
      const pB = playerDB.find(x => x.name === nameB);
      const targetIdx = startingList.findIndex((r, i) => i !== idx && r.name === nameB);
      const oldPosOfB = Object.keys(positionAssignments).find(k => positionAssignments[k] === nameB) || '';

      // [예외 처리] 빈 값(공백) 선택 시
      if (!nameB) {
        if (idx === 9) positionAssignments['P'] = '';
        else if (oldPosOfA) positionAssignments[oldPosOfA] = '';
        startingList[idx] = { name: '', num: '', pos: '' };
        refreshAll();
        return;
      }

      // [상황 1] 투수 행(idx 9) 전용 로직
      if (idx === 9) {
        if (targetIdx !== -1) {
          if (playerA_Name && oldPosOfB) positionAssignments[oldPosOfB] = playerA_Name;
          else if (oldPosOfB) positionAssignments[oldPosOfB] = '';
          startingList[targetIdx].pos = oldPosOfB ? convertPosition(oldPosOfB) : '';
        } else {
          if (oldPosOfB && playerA_Name) {
            positionAssignments[oldPosOfB] = playerA_Name;
            const startIdxOfA = startingList.findIndex(r => r.name === playerA_Name);
            if (startIdxOfA !== -1) startingList[startIdxOfA].pos = convertPosition(oldPosOfB);
          } else if (oldPosOfB) {
            positionAssignments[oldPosOfB] = '';
          }
        }
        positionAssignments['P'] = nameB;
        startingList[9] = { name: nameB, num: pB ? pB.num : '', pos: '투수(P)' };
      }

      // [상황 2] 일반 타순(1~9번) 교체 로직
      else {
        if (targetIdx !== -1 && targetIdx !== 9) {
          // 일반 타순 내 맞교환 (각자 포지션 유지)
          startingList[targetIdx] = {
            name: playerA_Name,
            num: pA ? pA.num : '',
            pos: oldPosOfA ? convertPosition(oldPosOfA) : ''
          };

          startingList[idx] = {
            name: nameB,
            num: pB ? pB.num : '',
            pos: oldPosOfB ? convertPosition(oldPosOfB) : ''
          };
        } else {
          // 대기 명단에서 선수를 새로 불러오거나, 투수 행의 선수와 교환할 때
          if (targetIdx === -1 && oldPosOfB) {
            // ⭐ [신규 반영] 대기 명단에 있던 선수가 이미 포지션을 가진 경우
            // 수비 위치(DB)를 서로 덮어쓰지 않아, 두 선수 모두 기존 포지션이 유지됨
            startingList[idx] = {
              name: nameB,
              num: pB ? pB.num : '',
              pos: convertPosition(oldPosOfB)
            };
          } else {
            // 포지션이 없는 순수 대기 선수일 경우: 기존 타자의 포지션 승계
            if (oldPosOfA) positionAssignments[oldPosOfA] = nameB;
            startingList[idx] = {
              name: nameB,
              num: pB ? pB.num : '',
              pos: oldPosOfA ? convertPosition(oldPosOfA) : ''
            };
          }
        }
      }

      excludedPlayers = excludedPlayers.filter(n => n !== nameB);
      refreshAll();
    }

    // 새로 추가된 취소선 토글 함수
    function toggleExcluded(name) {
      if (!name) return;
      if (excludedPlayers.includes(name)) {
        excludedPlayers = excludedPlayers.filter(n => n !== name);
      } else {
        excludedPlayers.push(name);
      }
      renderWaitingTable(); // 전체 리프레시 대신 대기 명단만 다시 그리기
    }

    function renderWaitingTable() {
      const tbody = document.getElementById('waitingTableBody');
      const rows = Array.from(tbody.querySelectorAll('tr'));

      const used = startingList.map(r => r.name).filter(Boolean);
      // 순수 대기자 목록
      const allWaiting = selectedPlayers.filter(n => !used.includes(n));

      // 취소선 없는 사람과 있는 사람으로 분리 후 각각 정렬
      const activeWaiting = allWaiting.filter(n => !excludedPlayers.includes(n)).sort((a, b) => a.localeCompare(b, 'ko'));
      const inactiveWaiting = allWaiting.filter(n => excludedPlayers.includes(n)).sort((a, b) => a.localeCompare(b, 'ko'));

      // 두 배열을 합침 (활성 선수가 위, 취소선 선수가 아래)
      const sortedWaitingList = [...activeWaiting, ...inactiveWaiting];

      const totalNeeded = Math.max(10, sortedWaitingList.length);
      while (rows.length < totalNeeded) {
        const tr = document.createElement("tr"); tr.innerHTML = "<td></td>"; tbody.appendChild(tr); rows.push(tr);
      }
      while (rows.length > totalNeeded) { tbody.removeChild(rows.pop()); }

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];

        // 기존 클래스 및 이벤트 초기화
        row.className = "";
        row.onclick = null;
        row.style.cursor = 'default';

        const cell = row.querySelector("td");
        const name = sortedWaitingList[i];

        if (name) {
          const assignedPos = Object.keys(positionAssignments).find(k => positionAssignments[k] === name);
          if (assignedPos) row.classList.add("position-selected");

          // 취소선 처리
          if (excludedPlayers.includes(name)) {
            row.classList.add("excluded-player");
          }

          cell.textContent = nameWithNum(name);

          // 클릭 이벤트 추가
          row.style.cursor = 'pointer';
          row.onclick = () => toggleExcluded(name);

        } else {
          cell.textContent = "";
        }
      }
    }

    function renderPositionAbility() {
      const container = document.getElementById('positionAbilityContainer');
      container.innerHTML = '';
      const table = document.createElement('table');
      table.classList.add("table_common");
      const players = [...selectedPlayers].sort((a, b) => a.localeCompare(b, 'ko'));
      abilityPositions.forEach(pos => {
        const starters = []; const backups = [];
        players.forEach(name => {
          const p = playerDB.find(x => x.name === name);
          const val = Number(p[pos.key]);
          if (val === 2) starters.push(name); else if (val === 1) backups.push(name);
        });
        const trStarter = document.createElement('tr');
        const tdPos = document.createElement('td'); tdPos.textContent = pos.label; tdPos.rowSpan = 2;
        tdPos.style.background = 'var(--table-hdr-bg)'; tdPos.style.fontWeight = 'bolder';
        trStarter.appendChild(tdPos);
        const tdStarterLabel = document.createElement('td'); tdStarterLabel.textContent = '주';
        tdStarterLabel.style.background = 'var(--table-hdr-bg)'; tdStarterLabel.style.fontWeight = 'bolder';
        trStarter.appendChild(tdStarterLabel);
        starters.forEach(name => {
          const td = document.createElement('td'); td.textContent = nameWithNum(name);
          td.onclick = (e) => onAbilityClick(name, pos.key, e);
          const assigned = Object.keys(positionAssignments).find(k => positionAssignments[k] === name);
          if (assigned) {
            if (isSamePosition(pos.key, assigned)) td.classList.add("position-selected");
            else td.classList.add("position-locked");
          }
          trStarter.appendChild(td);
        });
        const trBackup = document.createElement('tr');
        const tdBackupLabel = document.createElement('td'); tdBackupLabel.textContent = '부';
        tdBackupLabel.style.background = 'var(--highlight-bg)'; tdBackupLabel.style.fontWeight = 'bolder';
        trBackup.appendChild(tdBackupLabel);
        backups.forEach(name => {
          const td = document.createElement('td'); td.textContent = nameWithNum(name);
          td.onclick = (e) => onAbilityClick(name, pos.key, e);
          const assigned = Object.keys(positionAssignments).find(k => positionAssignments[k] === name);
          if (assigned) {
            if (isSamePosition(pos.key, assigned)) td.classList.add("position-selected");
            else td.classList.add("position-locked");
          }
          trBackup.appendChild(td);
        });
        table.appendChild(trStarter); table.appendChild(trBackup);
      });
      container.appendChild(table);
    }

    function isSamePosition(posKey, assigned) {
      if (!assigned) return false;
      const a = assigned.toLowerCase();
      if (posKey === 'of') return ['cf', 'lf', 'rf'].includes(a);
      return posKey.toLowerCase() === a;
    }

    function convertPosition(code) {
      const map = { CF: '중견수(CF)', LF: '좌익수(LF)', RF: '우익수(RF)', SS: '유격수(SS)', '2B': '2루수(2B)', '3B': '3루수(3B)', '1B': '1루수(1B)', P: '투수(P)', C: '포수(C)', DH: '지명타자(DH)' };
      return map[code] || '';
    }

    let pendingOutfieldPlayer = null;

    function onAbilityClick(name, posKey, e) {
      const currentPos = Object.keys(positionAssignments).find(k => positionAssignments[k] === name);

      if (posKey === 'of') {
        if (currentPos && ['CF', 'LF', 'RF'].includes(currentPos)) {
          updatePosition(currentPos, '');
          return;
        }

        e.stopPropagation();
        pendingOutfieldPlayer = name;
        const popup = document.getElementById("outfieldPopup");
        popup.style.left = `50%`; popup.style.top = `50%`; popup.style.transform = `translate(-50%, -50%)`;
        popup.style.display = "block";
        return;
      }

      const posMap = { p: 'P', c: 'C', '1b': '1B', '2b': '2B', '3b': '3B', ss: 'SS' };
      const targetPos = posMap[posKey];

      if (positionAssignments[targetPos] === name) {
        updatePosition(targetPos, '');
      } else {
        updatePosition(targetPos, name);
      }
    }

    function selectOutfieldPosition(posCode) {
      if (pendingOutfieldPlayer) {
        updatePosition(posCode, pendingOutfieldPlayer);
      }
      pendingOutfieldPlayer = null;
      closeOutfieldPopup();
    }

    function closeOutfieldPopup() { document.getElementById("outfieldPopup").style.display = "none"; }

    function refreshAll() {
      renderPlayerSelect(); renderPlayerTable(); renderPositionSelects();
      renderStartingTable(); renderWaitingTable(); renderPositionAbility();
    }

    async function saveOrder() {
      const name = document.getElementById('orderName').value.trim();

      // 1. 입력 유효성 검사
      if (!name) {
        return alert("오더명을 입력하세요.");
      }

      const pw = prompt("비밀번호를 입력하세요");
      if (!pw) return;

      // 로딩 시작
      showLoading("오더 저장 처리 중...");

      try {
        // 2. 관리자 비밀번호 검증
        const valid = await fetch("https://us-central1-hunters-2026.cloudfunctions.net/checkPassword", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pw })
        }).then(r => r.json());

        if (valid.status !== "성공") {
          alert("비밀번호 오류");
          return;
        }

        // 3. 기존 오더 중복 확인
        const exists = await fetch("https://us-central1-hunters-2026.cloudfunctions.net/orderExists?name=" + encodeURIComponent(name)).then(r => r.json());
        if (exists.exists && !confirm("이미 존재하는 오더입니다. 덮어쓸까요?")) {
          return;
        }

        // 4. 저장할 데이터 패키징 (excludedPlayers도 함께 저장)
        const payload = {
          players: selectedPlayers.map(n => {
            const p = playerDB.find(x => x.name === n);
            return { name: n, num: p.num };
          }),
          positions: { ...positionAssignments },
          startingList: startingList.map(r => ({ name: r.name, pos: r.pos })),
          excludedPlayers: excludedPlayers // 취소선 목록 추가
        };

        // 5. 서버에 오더 저장 요청
        const res = await fetch("https://us-central1-hunters-2026.cloudfunctions.net/saveOrder", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ orderName: name, payload })
        }).then(r => r.json());

        // 6. 결과 처리
        if (res.status === "성공") {
          alert("저장되었습니다!");
          location.href = "index.html";
        } else {
          alert("저장 실패: " + res.error);
        }

      } catch (error) {
        console.error("저장 중 오류 발생:", error);
        alert("통신 오류가 발생했습니다. 다시 시도해주세요.");
      } finally {
        // 성공하든 실패하든 로딩 인디케이터를 반드시 숨김
        hideLoading();
      }
    }

    window.onload = async () => {
      applySavedTheme();
      await loadPlayerDB();
      setupStartingTable();
      refreshAll();

      const orderName = new URLSearchParams(window.location.search).get("orderName");
      if (orderName) {
        document.getElementById('orderName').value = orderName;
        try {
          const data = await fetch("https://us-central1-hunters-2026.cloudfunctions.net/getOrder?name=" + encodeURIComponent(orderName)).then(r => r.json());
          if (data && data.payload) {
            selectedPlayers = data.payload.players ? data.payload.players.map(p => p.name) : [];
            positionAssignments = { ...positionAssignments, ...data.payload.positions };
            startingList = Array.isArray(data.payload.startingList) ? [...data.payload.startingList] : Array(10).fill().map(() => ({ name: '', pos: '' }));
            // 저장된 취소선 데이터가 있으면 불러오기
            if (data.payload.excludedPlayers) {
              excludedPlayers = [...data.payload.excludedPlayers];
            }
            refreshAll();
          }
        } catch (e) {
          console.error("오더 정보를 불러오는 데 실패했습니다.", e);
        }
      }

      document.addEventListener("click", (e) => {
        const popup = document.getElementById("outfieldPopup");
        if (popup.style.display === "block" && !popup.contains(e.target)) closeOutfieldPopup();
      });
    };
  </script>
  <div id="outfieldPopup"
    style="display:none; position:fixed; background:var(--bg-main); border:2px solid var(--table-border); padding:20px; border-radius:10px; z-index:1000; text-align:center; color:var(--text-main);">
    <h3 style="margin-top:0;">외야 포지션 선택</h3>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="buttonStyles" onclick="selectOutfieldPosition('LF')">좌익수(LF)</button>
      <button class="buttonStyles" onclick="selectOutfieldPosition('CF')">중견수(CF)</button>
      <button class="buttonStyles" onclick="selectOutfieldPosition('RF')">우익수(RF)</button>
    </div>
    <br>
    <button class="buttonStyles" onclick="closeOutfieldPopup()">취소</button>
  </div>

</body>
